<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AMH Blogs</title>
  <meta name="description" content="Thoughts, notes and ideas, in your language.">
  <meta name="theme-color" content="#faf8f4">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/prose.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    /* set the theme before first paint to avoid a flash */
    try {
      var t = localStorage.getItem('ib_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="/" data-link>
        <img id="brandLogo" alt="" hidden width="32" height="32">
        <span id="brandName">AMH Blogs</span>
      </a>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" aria-label="Search">
      </form>
      <label class="lang-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        <select id="langSelect" aria-label="Language"></select>
      </label>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Topics">
      <h2 class="side-title" id="topicsTitle">Topics</h2>
      <nav class="topic-list" id="topicList"></nav>
      <div class="about" id="aboutBox" hidden>
        <h2 class="side-title" id="aboutTitle">About</h2>
        <p id="aboutText"></p>
      </div>
    </aside>
    <main class="main" id="view" aria-live="polite"></main>
  </div>

  <footer class="footer">
    <div id="footerText"></div>
    <nav id="footerLinks"></nav>
  </footer>
  <div class="toast" id="toast" role="status"></div>

  <script src="/js/langs.js"></script>
  <script src="/js/public.js"></script>
</body>
</html>
