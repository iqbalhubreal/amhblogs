<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · AMH Blogs</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/prose.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script>
    try {
      var t = localStorage.getItem('ib_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- sign in -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="/assets/logo.svg" alt="" width="52" height="52" id="loginLogo">
      <h1>Admin panel</h1>
      <p>Enter your password to manage the blog.</p>
      <input type="password" id="loginPw" placeholder="Password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
      <div class="login-err" id="loginErr" role="alert"></div>
    </form>
  </section>

  <!-- app -->
  <div class="shell" id="app" hidden>
    <header class="mbar">
      <button class="icon-btn" id="navBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <strong id="mbarTitle">Admin</strong>
    </header>
    <div class="scrim" id="navScrim"></div>
    <aside class="nav" id="nav">
      <a class="nav-brand" href="#/posts"><img src="/assets/logo.svg" alt="" width="30" height="30" id="navLogo"><span id="navName">AMH Blogs</span><em>Admin</em></a>
      <nav class="nav-links">
        <a href="#/posts" data-r="posts"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Posts</a>
        <a href="#/post/new" data-r="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New post</a>
        <a href="#/topics" data-r="topics"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Topics</a>
        <a href="#/media" data-r="media"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>Media</a>
        <button type="button" id="uploaderBtn" title="Upload video, PDF, audio or big images and get a link"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Uploader</button>
        <a href="#/health" data-r="health"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Setup check</a>
      </nav>
      <div class="nav-foot">
        <a class="nav-mini" href="/" target="_blank" rel="noopener">View site ↗</a>
        <a class="nav-mini" href="https://app.pagescms.org" target="_blank" rel="noopener">Pages CMS ↗</a>
        <div class="nav-row">
          <button class="btn ghost sm" id="themeBtn" type="button">Theme</button>
          <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="/js/langs.js"></script>
  <script src="/admin/media.js"></script>
  <script src="/admin/drawpad.js"></script>
  <script src="/admin/editor.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
