# Pages CMS configuration  ->  https://app.pagescms.org
# Edits the look & feel of the site (name, logo, colors, text). Posts are written in /admin.
media:
  input: public/assets
  output: /assets

content:
  - name: site
    label: Site settings
    type: file
    path: public/data/site.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: tagline
        label: Tagline (shown on the home page)
        type: string
      - name: logo
        label: Logo
        type: image
        description: Square images look best. Leave empty to show only the name.
      - name: showLogo
        label: Show the logo
        type: boolean
      - name: accent
        label: Accent color (light mode)
        type: string
        description: A hex color like #b4532a
      - name: accentDark
        label: Accent color (dark mode)
        type: string
        description: A lighter hex color like #e8946a
      - name: headingFont
        label: Heading font
        type: select
        options:
          values:
            - Fraunces
            - Playfair Display
            - Lora
            - Merriweather
            - DM Serif Display
            - Inter
            - Poppins
      - name: publicUrl
        label: Public site address (optional)
        type: string
        description: Only if admin runs on a separate site, e.g. https://amhblogs.netlify.app
      - name: about
        label: About box (sidebar)
        type: text
      - name: footer
        label: Footer text
        type: string
      - name: links
        label: Footer links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
